name: Feature Request
description: Suggest a new feature or improvement for DelugeHub
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea as clearly as possible.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: "Example: I often have to manually update XML paths after moving samples, which takes a lot of time."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Relevant module
      description: Which part of DelugeHub would this affect?
      options:
        - Song Manager
        - Kit Manager
        - Synth Editor
        - Sample Manager
        - Lost Sample Finder
        - Batch Hub
        - Backup & Sync
        - Settings
        - New module / General
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would significantly improve my workflow
        - Blocking — I can't use DelugeHub without this
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any alternative solutions or workarounds you've tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, screenshots, or examples that might help.
